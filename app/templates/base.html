<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}长虹{% endblock %}</title>
  <script src="/static/app.js?v={{ asset_versions.get('app.js', 'dev') }}"></script>
  <link rel="stylesheet" href="/static/site.css?v={{ asset_versions.get('site.css', 'dev') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">跳至正文</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="长虹首页">
        <span class="brand-mark" aria-hidden="true">虹</span>
        <span>长虹</span>
      </a>
      <div class="header-actions">
        <label class="theme-control" data-theme-control hidden>
          <span class="sr-only">显示主题</span>
          <select id="theme-select">
            <option value="system">跟随系统</option>
            <option value="light">浅色主题</option>
            <option value="dark">深色主题</option>
          </select>
        </label>
        {% block header_actions %}{% endblock %}
      </div>
    </div>
  </header>
  <main class="shell" id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
