name: 测试并发布 Docker 镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 发布任务串行，避免 main 与版本标签争用同一版本；PR 各自验证。
concurrency:
  group: docker-publish-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  queue: max
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: pushytao/notify
      TEST_IMAGE: pushytao/notify:ci-${{ github.sha }}
      VERSION_SERIES: '0.1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 安装锁定依赖
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --extra asr
      - name: Python 与前端回归测试
        run: |
          uv run --no-sync pytest -q
          node --test tests/market_strip.test.cjs tests/market_ui.test.cjs
      - name: 生成镜像版本号
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            version="$VERSION_SERIES.$GITHUB_RUN_NUMBER"
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: 构建待验证镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验证简版和完整采集版的目录映射、启动与持久化
        run: |
          python scripts/smoke_image.py --image "$TEST_IMAGE"
          python scripts/smoke_image.py --full --image "$TEST_IMAGE"
      - name: 判断是否发布
        id: release
        if: github.event_name != 'pull_request' && github.repository == 'PushyTao/notify'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            current=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo '已有更新的 main 提交，本次测试通过但不覆盖 latest。' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "channel=$VERSION" >> "$GITHUB_OUTPUT"
            echo 'update_latest=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "channel=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo '只发布 main 或 vX.Y.Z 标签；当前仅完成验证。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 检查 Docker Hub 发布凭据
        if: steps.release.outputs.channel != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::请在仓库 Settings → Secrets and variables → Actions 配置 DOCKERHUB_TOKEN（Docker Hub Read & Write 访问令牌）。'
            exit 1
          fi
      - name: 登录 Docker Hub
        if: steps.release.outputs.channel != ''
        uses: docker/login-action@v4
        with:
          username: pushytao
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 发布已通过测试的同一镜像
        if: steps.release.outputs.channel != ''
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          UPDATE_LATEST: ${{ steps.release.outputs.update_latest }}
        shell: bash
        run: |
          if [[ "$CHANNEL" != latest ]]; then
            error_file="$RUNNER_TEMP/manifest-error.txt"
            if docker manifest inspect "$IMAGE:$CHANNEL" >/dev/null 2>"$error_file"; then
              echo "::error::版本 $CHANNEL 已存在，不会覆盖。若 main 上次发布只完成了一部分，请使用 Run workflow 创建新运行和新版本号；手动标签请使用新版本号。"
              exit 1
            fi
            # 只有明确不存在才放行；认证、网络或限流错误均停止发布。
            if ! grep -Fxq "no such manifest: docker.io/$IMAGE:$CHANNEL" "$error_file"; then
              cat "$error_file" >&2
              echo '::error::无法确认版本是否存在，停止发布以免覆盖旧版本。'
              exit 1
            fi
          fi
          docker tag "$TEST_IMAGE" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$TEST_IMAGE" "$IMAGE:$CHANNEL"
          docker push "$IMAGE:$CHANNEL"
          echo "已发布：\`$IMAGE:$CHANNEL\` 和 \`$IMAGE:sha-$GITHUB_SHA\`。" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$UPDATE_LATEST" == true ]]; then
            docker tag "$TEST_IMAGE" "$IMAGE:latest"
            docker push "$IMAGE:latest"
            echo "\`$IMAGE:latest\` 已更新为 \`$CHANNEL\`。" >> "$GITHUB_STEP_SUMMARY"
          fi
