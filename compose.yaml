name: douyin-notify

x-app: &app
  build: .
  image: douyin-notify:local
  restart: unless-stopped
  environment: &environment
    APP_SECRET_KEY: ${APP_SECRET_KEY:?Please set APP_SECRET_KEY in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Please set ADMIN_PASSWORD in .env}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    DATA_DIR: /data
    ASR_CACHE_DIR: /data/models
    HF_HOME: /data/models/huggingface
    TZ: Asia/Shanghai
  volumes:
    - notify-data:/data
  extra_hosts:
    - host.docker.internal:host-gateway
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

services:
  web:
    <<: *app
    ports:
      - "${BIND_HOST:-0.0.0.0}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  notify-data:
