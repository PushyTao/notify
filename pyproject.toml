[project]
name = "douyin-notify"
version = "0.1.0"
description = "Self-hosted Douyin video transcription and email digest"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4", "cryptography>=44,<49", "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3", "tzdata>=2025.1"
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "beautifulsoup4>=4.13,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
